<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="XM 検証ツール">
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!--
    値動きと、その下に引いた基準線。
    このツールが出すのは「上がる/下がる」ではなく「基準を超えているか」なので、
    折れ線だけでなく水平の基準線を入れてある。
  -->
  <polyline points="5,21 11,13 16,17 21,8 27,12"
            fill="none" stroke="#38bdf8" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="5" y1="26" x2="27" y2="26" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
</svg>
